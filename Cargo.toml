[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.7.3"
edition = "2024"
license = "Apache-2.0"
authors = ["AsyncFinn"]
repository = "https://github.com/AsyncFinn/rook"
rust-version = "1.97.1"

[workspace.dependencies]
# Rook crates
rook-platform = { path = "crates/rook-platform" }
rook-types = { path = "crates/rook-types" }
rook-reflection = { path = "crates/rook-reflection" }
rook-formats = { path = "crates/rook-formats" }
rook-dom = { path = "crates/rook-dom" }
rook-lua = { path = "crates/rook-lua" }
rook-engine = { path = "crates/rook-engine" }
rook-render = { path = "crates/rook-render" }
rook-view = { path = "crates/rook-view" }
rook-net = { path = "crates/rook-net" }
rook-physics = { path = "crates/rook-physics" }
rook-content = { path = "crates/rook-content" }
rook-audio = { path = "crates/rook-audio", default-features = false }
rook-terrain = { path = "crates/rook-terrain" }
rook-gui = { path = "crates/rook-gui" }

# Roblox formats and data (rbx-dom ecosystem)
rbx_dom_weak = "4.2"
rbx_types = "3.1"
rbx_binary = "3.0"
rbx_xml = "3.0"
rbx_reflection = "7.0"
rmp-serde = "1.3"

# Lua parsing (corpus scanner)
# Default features stay on: full_moon 3.0.0 fails to build without `serde`.
full_moon = { version = "3.0", features = ["luau"] }

# Legacy XML upgrade
quick-xml = "0.42"
base64 = "0.23"

# General
glam = "0.34"
# Physics
# `parallel`: the narrow phase and solver run on all cores; results are
# identical to a serial build (Rapier colors constraints the same way).
rapier3d = { version = "0.36", features = ["parallel"] }
thiserror = "2"
# std::fs with the path in error messages
fs-err = "3.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `with-file-history`: the prompt's history is kept between runs
rustyline = { version = "18", default-features = false, features = ["with-file-history", "custom-bindings"] }
# Logging (rook-engine's `logging`): events from every crate, printed in the
# console's line format and written to a file per run
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# The platform's data, state and log folders (rook-engine's `data`)
directories = "6"
walkdir = "2"
blake3 = "1"
# rook-player's allocator (the system one is slow on big heaps)
mimalloc = "0.1"
# HTTPS (rook-platform's `native` network, for asset delivery): rustls
# and gzip, no async runtime
ureq = "3"
# The system clipboard (rook-platform's `native` clipboard, for TextBox
# copy and paste): text only
arboard = { version = "3", default-features = false }
# Roblox mesh files, versions 1.00 to 5.00 (rook-content)
rbx_mesh = { version = "0.8.2", default-features = false }
# KTX2 images (rook-content): levels are Zstandard-compressed (the same
# zstd rbx_binary uses)
zstd = "0.13"
# Roblox's client packages (rook-content's `packages`): Deflate zips,
# checked against their manifest's MD5
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
md5 = "0.8"
# The LZ4 chunks of binary files, read beside rbx_binary for the compiled
# scripts it skips (rook-formats' `compiled`); the version rbx_binary uses
lz4_flex = "0.13"
slotmap = "1.1"
# Fast, deterministic hashing for engine-internal maps keyed by ids and names
rustc-hash = "2.1"
profiling = "1"
# Sound files (rook-content): pure-Rust WAV (PCM, ADPCM), Ogg Vorbis and MP3
# decoders, nothing else (docs/behavior/audio/playback.md)
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "mp3"] }
# GUI text (rook-gui): HarfRust shapes (HarfBuzz's own Rust port), skrifa
# reads glyph outlines and zeno rasterizes them; all on the same
# read-fonts. Rook lays lines out itself: Roblox rounds every glyph's
# advance to whole pixels (docs/behavior/gui/text.md).
harfrust = "0.12"
skrifa = "0.44"
zeno = "0.3"
# Thread priority on Windows (rook-content)
windows-sys = "0.61"
# Audio output device (rook-audio)
cpal = "0.15"

# Rendering
# Rook draws through DX12, Vulkan or Metal; leaving out the GL backend and
# its shader translator saves a few megabytes of every exe.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = "0.30"
# Shader modules (rook-render's build script): imports and @if over
# WGSL, with its own parser, so wgpu upgrades never wait on it (`naga-ext`
# only lets it parse wgpu's `binding_array`);
# `include_wesl!` is in wesl-core
wesl = { version = "0.6", default-features = false, features = ["naga-ext"] }
wesl-core = "0.1"
# Checks the built shaders at build time (rook-render's build script);
# the same version wgpu uses
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# Images: decals, textures and mesh textures (rook-content), screenshots
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "dds"] }
# Block compression of material textures (rook-content): Intel's ISPC
# encoder, and a decoder for devices that can't sample blocks
intel_tex_2 = "0.5"
bcdec_rs = "0.2"

# The apps' icon (apps/build.rs): resvg draws resources/rook.svg into the .ico
# (no text or images, which the icon doesn't use); embed-resource links it
# into the Windows executables
resvg = { version = "0.45", default-features = false }
embed-resource = "3"

# Luau
mlua = { version = "0.12", features = ["luau", "vendored"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
match_same_arms = "warn"
unnecessary_wraps = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"

# Build profiles:
#   dev        `cargo build`: Rook's own code lightly optimized (fast to
#              rebuild, keeps debug assertions); every dependency fully
#              optimized so Luau, wgpu and the file decoders run at speed.
#   release    `cargo build --release`: what players use.
#   profiling  `cargo build --profile profiling`: release speed plus full
#              debug info for profilers. Builds into target/profiling, so
#              it never collides with a running release build. Add
#              `--features tracy` to rook-player for a live Tracy timeline.
#
# dev sets the dependencies' opt-level and lowers Rook's own crates by
# name, rather than raising `package."*"`: Cargo ranks `package."*"` above
# `build-override`, so it would also optimize proc macros and build-script
# dependencies (syn, serde_derive, wesl, the build script's naga), which
# only cost compile time. A crate missing from the list still builds, just
# slower to rebuild; `rook-tools drift` checks every member is listed.
[profile.dev]
opt-level = 3

[profile.dev.build-override]
opt-level = 0
# Set, not left to Cargo's "when possible" default: that default picks
# differently under `cargo check` and `cargo build`, so the two compiled
# every build script twice, Luau's C++ included (about 3 minutes each).
debug = false

[profile.dev.package.rook-audio]
opt-level = 1
[profile.dev.package.rook-cli]
opt-level = 1
[profile.dev.package.rook-content]
opt-level = 1
[profile.dev.package.rook-dom]
opt-level = 1
[profile.dev.package.rook-engine]
opt-level = 1
[profile.dev.package.rook-formats]
opt-level = 1
[profile.dev.package.rook-gui]
opt-level = 1
[profile.dev.package.rook-lua]
opt-level = 1
[profile.dev.package.rook-net]
opt-level = 1
[profile.dev.package.rook-physics]
opt-level = 1
[profile.dev.package.rook-platform]
opt-level = 1
[profile.dev.package.rook-player]
opt-level = 1
[profile.dev.package.rook-reflection]
opt-level = 1
[profile.dev.package.rook-render]
opt-level = 1
[profile.dev.package.rook-terrain]
opt-level = 1
[profile.dev.package.rook-types]
opt-level = 1
[profile.dev.package.rook-view]
opt-level = 1

[profile.release]
debug = "line-tables-only"
# Whole-program optimization: rook-player is about 15% smaller, at the cost
# of a slower release build (dev builds are unaffected).
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
