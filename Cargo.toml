[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
authors = ["AsyncFinn"]
repository = "https://github.com/AsyncFinn/rook"
rust-version = "1.97.1"

[workspace.dependencies]
# Rook crates
rook-platform = { path = "crates/rook-platform" }
rook-types = { path = "crates/rook-types" }
rook-reflection = { path = "crates/rook-reflection" }
rook-formats = { path = "crates/rook-formats" }
rook-dom = { path = "crates/rook-dom" }
rook-lua = { path = "crates/rook-lua" }
rook-engine = { path = "crates/rook-engine" }
rook-render = { path = "crates/rook-render" }
rook-view = { path = "crates/rook-view" }
rook-net = { path = "crates/rook-net" }
rook-physics = { path = "crates/rook-physics" }
rook-content = { path = "crates/rook-content" }
rook-audio = { path = "crates/rook-audio", default-features = false }
rook-terrain = { path = "crates/rook-terrain" }

# Roblox formats and data (rbx-dom ecosystem)
rbx_dom_weak = "4.2"
rbx_types = "3.1"
rbx_binary = "3.0"
rbx_xml = "3.0"
rbx_reflection = "7.0"
rbx_reflection_database = "=3.0.1"

# Lua parsing (corpus scanner)
# Default features stay on: full_moon 3.0.0 fails to build without `serde`.
full_moon = { version = "3.0", features = ["luau"] }

# Legacy XML upgrade
quick-xml = "0.42"
base64 = "0.23"

# General
glam = "0.34"
# Physics
# `parallel`: the narrow phase and solver run on all cores; results are
# identical to a serial build (Rapier colours constraints the same way).
rapier3d = { version = "0.36", features = ["parallel"] }
thiserror = "2"
# std::fs with the path in error messages
fs-err = "3.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `with-file-history`: the prompt's history is kept between runs
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
# Logging (rook-engine's `logging`): events from every crate, printed in the
# console's line format and written to a file per run
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# The platform's data, state and log folders (rook-engine's `data`)
directories = "6"
walkdir = "2"
blake3 = "1"
# rook-player's allocator (the system one is slow on big heaps)
mimalloc = "0.1"
# HTTPS (rook-platform's `native` network, for asset delivery): rustls
# and gzip, no async runtime
ureq = "3"
# Roblox mesh files, versions 1.00 to 5.00 (rook-content)
rbx_mesh = { version = "0.8.2", default-features = false }
# KTX2 images (rook-content): levels are Zstandard-compressed (the same
# zstd rbx_binary uses)
zstd = "0.13"
slotmap = "1.1"
# Fast, deterministic hashing for engine-internal maps keyed by ids and names
rustc-hash = "2.1"
profiling = "1"
# Sound files (rook-content): pure-Rust WAV (PCM, ADPCM), Ogg Vorbis and MP3
# decoders, nothing else (docs/behavior/audio.md)
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "ogg", "vorbis", "mp3"] }
# Thread priority on Windows (rook-content)
windows-sys = "0.61"
# Audio output device (rook-audio)
cpal = "0.15"

# Rendering
wgpu = "30"
winit = "0.30"
# Shader modules (rook-render's build script): imports and @if over
# WGSL, with its own parser, so wgpu upgrades never wait on it (`naga-ext`
# only lets it parse wgpu's `binding_array`);
# `include_wesl!` is in wesl-core
wesl = { version = "0.6", default-features = false, features = ["naga-ext"] }
wesl-core = "0.1"
# Checks the built shaders at build time (rook-render's build script);
# the same version wgpu uses
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# Images: decals, textures and mesh textures (rook-content), screenshots
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "dds"] }
# Block compression of material textures (rook-content): Intel's ISPC
# encoder, and a decoder for devices that can't sample blocks
intel_tex_2 = "0.5"
bcdec_rs = "0.2"

# Luau
mlua = { version = "0.12", features = ["luau", "vendored"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
match_same_arms = "warn"
unnecessary_wraps = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"

# Build profiles:
#   dev        `cargo build`: Rook's own code lightly optimised (fast to
#              rebuild, keeps debug assertions); every dependency fully
#              optimised so Luau, wgpu and the file decoders run at speed.
#   release    `cargo build --release`: what players use.
#   profiling  `cargo build --profile profiling`: release speed plus full
#              debug info for profilers. Builds into target/profiling, so
#              it never collides with a running release build. Add
#              `--features tracy` to rook-player for a live Tracy timeline.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
