[package]
name = "rook-client"
description = "A Rook client without an operating system of its own: the game, its frame loop and drawing, for apps to put in a window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
window = ["dep:winit", "dep:gilrs", "dep:windows-sys", "rook-audio/output"]
# The `>` prompt in the terminal that runs Luau in the open place.
repl = ["rook-engine/repl"]

[dependencies]
rook-types.workspace = true
rook-dom.workspace = true
rook-render.workspace = true
rook-scene.workspace = true
rook-platform.workspace = true
rook-content.workspace = true
rook-audio.workspace = true
rook-engine.workspace = true
rook-lua.workspace = true
winit = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
glam.workspace = true
image.workspace = true
anyhow.workspace = true
tracing.workspace = true
profiling.workspace = true
rustc-hash.workspace = true

# Sony's pads over HID, which Windows' gamepad API doesn't list.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
rook-platform = { workspace = true, features = ["native"] }
rook-reflection.workspace = true

[lints]
workspace = true
