[package]
name = "rook-client"
description = "A Rook client without an operating system of its own: the game, its frame loop and drawing, for apps to put in a window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The window, through winit: input, the mouse, the cursor and the frame
# loop, for every app that opens one (desktop or Android), and sound
# through the audio device.
window = ["dep:winit", "rook-audio/output"]
# winit on Android, for an app that runs as a NativeActivity.
android = ["window", "winit/android-native-activity"]
# The `>` prompt in the terminal that runs Luau in the open place.
repl = ["rook-engine/repl"]

[dependencies]
rook-types.workspace = true
rook-dom.workspace = true
rook-render.workspace = true
rook-scene.workspace = true
rook-platform.workspace = true
rook-content.workspace = true
rook-audio.workspace = true
rook-engine.workspace = true
rook-lua.workspace = true
winit = { workspace = true, optional = true }
glam.workspace = true
image.workspace = true
anyhow.workspace = true
tracing.workspace = true
profiling.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
rook-platform = { workspace = true, features = ["native"] }
rook-reflection.workspace = true

[lints]
workspace = true
