[package]
name = "rook-engine"
description = "Assembles a Rook DataModel: services, scripts, frame loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rustc-hash.workspace = true
rook-platform.workspace = true
rook-types.workspace = true
rook-reflection.workspace = true
rook-dom.workspace = true
rook-formats.workspace = true
rbx_dom_weak.workspace = true
rook-lua.workspace = true
rook-gui.workspace = true
rook-net.workspace = true
rook-physics.workspace = true
rook-content.workspace = true
rook-audio.workspace = true
mlua.workspace = true
thiserror.workspace = true
profiling.workspace = true
glam.workspace = true
anstream.workspace = true
anstyle.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
serde_json.workspace = true
rustyline = { workspace = true, optional = true }

[build-dependencies]
toml.workspace = true

[dev-dependencies]
rook-platform = { workspace = true, features = ["native"] }
rook-terrain.workspace = true

[features]
# The terminal command bar (`repl` module): Luau typed at the terminal runs
# in the game. Apps turn it on by default; leave it out of builds you hand
# to others.
repl = ["dep:rustyline"]
# Flags, variables and settings-file keys of the developer tier
# (`settings::Tier::Developer`), and Roblox's CoreScripts. The apps turn it
# on by default, so `cargo build --release` takes them; `cargo dist` leaves
# it out.
developer-overrides = []
# A build for other people (`cargo dist`), which must not have
# `developer-overrides`.
published = []

[lints]
workspace = true
