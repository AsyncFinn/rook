[package]
name = "rook-audio"
description = "Audio output and mixing for the Rook engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["output"]
# The output device (`Output`, through cpal). The engine leaves it off: it
# only needs the effects.
output = ["dep:cpal", "dep:windows", "dep:windows-core"]

[dependencies]
cpal = { workspace = true, optional = true }
glam.workspace = true
rook-content.workspace = true
rook-types.workspace = true
rustc-hash.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }
windows-core = { workspace = true, optional = true }

[lints]
workspace = true
