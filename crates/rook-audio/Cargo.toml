[package]
name = "rook-audio"
description = "Audio output and mixing for the Rook engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["output"]
# The output device (`Output`, through cpal). The engine leaves it off: it
# only needs the effects.
output = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
glam.workspace = true
rook-content.workspace = true
rook-types.workspace = true

[lints]
workspace = true
