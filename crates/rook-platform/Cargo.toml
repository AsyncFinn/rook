[package]
name = "rook-platform"
description = "The host machine as the portable Rook crates reach it: files, threads, workers, network, clipboard, credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Only apps turn this on (and crates' own tests, as dev-dependencies): a
# portable crate never does, so a host without threads or a file system
# can install its own (docs/design/architecture.md#crate-layout).
native = [
    "dep:rayon",
    "dep:ureq",
    "dep:arboard",
    "dep:keyring-core",
    "dep:windows-native-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dependencies]
arboard = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
rustc-hash.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[lints]
workspace = true
