[package]
name = "rook-player"
description = "Windowed player for the Rook engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rook-player"
path = "src/main.rs"

[dependencies]
fs-err.workspace = true
rook-types.workspace = true
rook-reflection.workspace = true
rook-dom.workspace = true
rook-formats.workspace = true
rook-render.workspace = true
rook-content.workspace = true
rook-audio = { workspace = true, features = ["output"] }
rook-engine.workspace = true
rook-physics.workspace = true
rook-terrain.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
glam.workspace = true
image.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
profiling.workspace = true
rayon.workspace = true
blake3.workspace = true

[features]
default = ["repl"]
# A `>` prompt in the terminal that runs Luau in the open place (on when
# the terminal is interactive; `--no-repl` turns it off).
repl = ["rook-engine/repl"]
# Live per-frame timeline in the Tracy profiler (https://github.com/wolfpld/tracy).
tracy = ["profiling/profile-with-tracy"]

[lints]
workspace = true
