[package]
name = "rook-player"
description = "Windowed player for the Rook engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Embeds the app icon and manifest (resources/README.md)
build = "../build.rs"

[[bin]]
name = "rook-player"
path = "src/main.rs"

[dependencies]
fs-err.workspace = true
rook-types.workspace = true
rook-client = { workspace = true, features = ["window"] }
rook-scene.workspace = true
rook-platform = { workspace = true, features = ["native"] }
rook-content.workspace = true
rook-engine.workspace = true
rook-lua.workspace = true
rfd.workspace = true
glam.workspace = true
anyhow.workspace = true
clap.workspace = true
profiling.workspace = true
mimalloc.workspace = true

[features]
default = ["repl", "developer-overrides", "counters"]
# A `>` prompt in the terminal that runs Luau in the open place (on when
# the terminal is interactive; `--no-repl` turns it off).
repl = ["rook-engine/repl", "rook-client/repl"]
# Developer settings (rook-engine's feature of the same name).
developer-overrides = ["rook-engine/developer-overrides"]
# Per-frame work counters, which `--bench` prints (rook-types' `counters`).
counters = ["rook-types/counters"]
# A build for other people: `cargo dist`.
published = ["rook-engine/published"]
# Live per-frame timeline in the Tracy profiler (https://github.com/wolfpld/tracy).
tracy = ["profiling/profile-with-tracy"]

[build-dependencies]
resvg.workspace = true
embed-resource.workspace = true

[lints]
workspace = true
