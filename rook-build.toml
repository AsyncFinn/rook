# What whoever builds Rook locks in: where its web requests go. Compiled
# in, so nothing on a player's machine changes them (a build with
# developer overrides takes the run-time `webBase` and `webDomains` over
# them). A build with `ROOK_BUILD_CONFIG=<file>` reads that file over this
# one: its keys win, and keys it leaves out keep the values here. An
# unknown key or a bad value fails the build. Every other setting is a
# run-time one; see docs/design/data-and-logging.md#settings.

# Where web requests go (asset delivery, Roblox's packages, users,
# filtering...). Left out: Roblox for asset delivery and its packages, and
# every other API answers locally. "off" answers everything locally;
# "example.com" sends users.roblox.com's requests to users.example.com; a
# URL ("http://127.0.0.1:8080") sends them to <URL>/users.
# webBase = "example.com"

# Per web domain, winning over webBase: a base URL, or "off".
[webDomains]
# users = "https://users.example.com"
# badges = "off"
